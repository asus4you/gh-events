name: Events Demo 2
on: 
  pull_request: 
    types:
      - opened
  workflow_dispatch: 
  push:
    branches: 
      - master
      - 'dev-*'
      - 'feat/**'
    paths:
      - '.github/workflows/demo2.yaml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJson(github.event) }}"
      - name: Get Code 
        uses: actions/checkout@v3 
      - name: Install Dependencies
        run: npm ci 
      - name: Test Code 
        run: npm run test 
      - name: Build Code 
        run: npm run build 
      - name: Deploy project 
        run: echo "Deploying the Code.!!.."
